<div class="d-flex flex-row p-3 bg-dark text-light rounded">
  <h3 class="me-auto">
    Your groups
  </h3>
  <button class="btn btn-success align-self-center me-3" (click)="openGroupAddModal()">Create</button>
  <form class="align-self-center">
    <div class="input-group">
      <input type="text" class="form-control" placeholder="Search">
      <div class="input-group-btn">
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>
  </form>
</div>
<!-- No groups displayed -->
<div class="d-flex justify-content-center mt-4">
  @if (groups != undefined && groups.length <= 0) {
    <h4>You have no groups</h4>
  }
  @if (groups === undefined) {
    <div class="spinner-border" role="status"></div>
  }
</div>
<!-- List of groups -->
<div class="row">
  @for (group of groups; track group) {
    <div class="col-md-3 my-3 d-flex align-items-stretch">
      <shr-group-thumbnail [group]="group" class="w-100"></shr-group-thumbnail>
    </div>
  }
</div>
